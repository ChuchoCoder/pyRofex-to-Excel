name: Package Release
run-name: >-
  Publish to ${{ github.event_name == 'release' && 'pypi' || (github.event_name == 'workflow_dispatch' && inputs.repository || 'testpypi') }} -
  ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.head_ref) || github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Destino de publicación"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
  release:
    types:
      - published
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
      BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Generate TestPyPI dev version
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi')
        run: python tools/ci/generate_testpypi_dev_version.py

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi') || github.event_name == 'pull_request'
    environment: testpypi
    permissions:
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Build TestPyPI install command summary
        run: python tools/ci/build_testpypi_summary.py

      - name: Publish to TestPyPI
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

      - name: Add TestPyPI package link to summary
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          TESTPYPI_PACKAGE: ${{ env.TESTPYPI_PACKAGE }}
          TESTPYPI_VERSION: ${{ env.TESTPYPI_VERSION }}
        run: |
          if [ -z "${TESTPYPI_PACKAGE}" ] || [ -z "${TESTPYPI_VERSION}" ]; then
            echo "Skipping TestPyPI link summary: missing package metadata"
            exit 0
          fi

          PACKAGE_URL="https://test.pypi.org/project/${TESTPYPI_PACKAGE}/${TESTPYPI_VERSION}/"
          {
            echo "- **Status:** ✅ Published"
            echo "- **Project URL:** [Open package page](${PACKAGE_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment PR with TestPyPI install command
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          TESTPYPI_PACKAGE: ${{ env.TESTPYPI_PACKAGE }}
          TESTPYPI_VERSION: ${{ env.TESTPYPI_VERSION }}
          TESTPYPI_INSTALL_CMD: ${{ env.TESTPYPI_INSTALL_CMD }}
        with:
          script: |
            const run = require('./tools/ci/comment_testpypi_install.js');
            await run({ github, context });

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi') || github.event_name == 'release'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Extract PyPI package metadata
        run: python tools/ci/extract_pypi_package_metadata.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Add PyPI package link to summary
        shell: bash
        env:
          PYPI_PACKAGE: ${{ env.PYPI_PACKAGE }}
          PYPI_VERSION: ${{ env.PYPI_VERSION }}
        run: |
          if [ -z "${PYPI_PACKAGE}" ] || [ -z "${PYPI_VERSION}" ]; then
            echo "Skipping PyPI link summary: missing package metadata"
            exit 0
          fi

          PACKAGE_URL="https://pypi.org/project/${PYPI_PACKAGE}/${PYPI_VERSION}/"
          {
            echo "## 🚀 PyPI Package"
            echo "- **Package:** ${PYPI_PACKAGE}"
            echo "- **Version:** ${PYPI_VERSION}"
            echo "- **Status:** ✅ Published"
            echo "- **Project URL:** [Open package page](${PACKAGE_URL})"
            echo "- **Install command:**"
            echo '```bash'
            echo "pip install ${PYPI_PACKAGE}==${PYPI_VERSION}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
