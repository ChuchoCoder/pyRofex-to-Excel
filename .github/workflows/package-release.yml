name: Package Release
run-name: >-
  Publish to ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'testpypi' }} -
  ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.head_ref) || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Destino de publicación"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.bump_version.outputs.release_version }}
      release_tag: ${{ steps.bump_version.outputs.release_tag }}
      release_commit_sha: ${{ steps.capture_release_commit.outputs.release_commit_sha }}
    env:
      PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
      BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate PyPI publish branch
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi'
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "PyPI publication automática solo permitida desde main"
            exit 1
          fi

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Bump release version in pyproject
        id: bump_version
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi'
        run: python tools/ci/bump_pyproject_version.py

      - name: Commit and push bumped version
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore(release): bump version to ${{ steps.bump_version.outputs.release_version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Capture release commit sha
        id: capture_release_commit
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi'
        run: |
          echo "release_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate TestPyPI dev version
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi')
        run: python tools/ci/generate_testpypi_dev_version.py

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi') || github.event_name == 'pull_request'
    environment: testpypi
    permissions:
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Build TestPyPI install command summary
        run: python tools/ci/build_testpypi_summary.py

      - name: Publish to TestPyPI
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

      - name: Add TestPyPI package link to summary
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          TESTPYPI_PACKAGE: ${{ env.TESTPYPI_PACKAGE }}
          TESTPYPI_VERSION: ${{ env.TESTPYPI_VERSION }}
        run: |
          if [ -z "${TESTPYPI_PACKAGE}" ] || [ -z "${TESTPYPI_VERSION}" ]; then
            echo "Skipping TestPyPI link summary: missing package metadata"
            exit 0
          fi

          PACKAGE_URL="https://test.pypi.org/project/${TESTPYPI_PACKAGE}/${TESTPYPI_VERSION}/"
          {
            echo "- **Status:** ✅ Published"
            echo "- **Project URL:** [Open package page](${PACKAGE_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment PR with TestPyPI install command
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          TESTPYPI_PACKAGE: ${{ env.TESTPYPI_PACKAGE }}
          TESTPYPI_VERSION: ${{ env.TESTPYPI_VERSION }}
          TESTPYPI_INSTALL_CMD: ${{ env.TESTPYPI_INSTALL_CMD }}
        with:
          script: |
            const run = require('./tools/ci/comment_testpypi_install.js');
            await run({ github, context });

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi'
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Extract PyPI package metadata
        run: python tools/ci/extract_pypi_package_metadata.py

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Add PyPI package link to summary
        shell: bash
        env:
          PYPI_PACKAGE: ${{ env.PYPI_PACKAGE }}
          PYPI_VERSION: ${{ env.PYPI_VERSION }}
        run: |
          if [ -z "${PYPI_PACKAGE}" ] || [ -z "${PYPI_VERSION}" ]; then
            echo "Skipping PyPI link summary: missing package metadata"
            exit 0
          fi

          PACKAGE_URL="https://pypi.org/project/${PYPI_PACKAGE}/${PYPI_VERSION}/"
          {
            echo "## 🚀 PyPI Package"
            echo "- **Package:** ${PYPI_PACKAGE}"
            echo "- **Version:** ${PYPI_VERSION}"
            echo "- **Status:** ✅ Published"
            echo "- **Project URL:** [Open package page](${PACKAGE_URL})"
            echo "- **Install command:**"
            echo '```bash'
            echo "pip install ${PYPI_PACKAGE}==${PYPI_VERSION}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create Git tag and GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_COMMIT_SHA: ${{ needs.build.outputs.release_commit_sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const targetCommit = process.env.RELEASE_COMMIT_SHA;

            if (!tag || !version || !targetCommit) {
              throw new Error('Missing release metadata from build job outputs');
            }

            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              core.info(`Release already exists for ${tag}: ${existing.data.html_url}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: targetCommit,
                name: tag,
                body: `Release automática de ${version}`,
                generate_release_notes: true,
                draft: false,
                prerelease: false,
              });

              core.info(`Created release ${created.data.html_url}`);
            }
